name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-22.04          # la plus ancienne version de Python acceptée par l'outil
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q -p no:cacheprovider

  installation:
    name: Installation réelle (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: Homebrew
          - os: macos-latest          # celui que le site conseille, sans Install Certificates
            python: python.org
          - os: ubuntu-latest
            python: système
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Python de python.org
        if: matrix.python == 'python.org'
        run: |
          curl -fsSLO https://www.python.org/ftp/python/3.13.12/python-3.13.12-macos11.pkg
          sudo installer -pkg python-3.13.12-macos11.pkg -target /
          P=/Library/Frameworks/Python.framework/Versions/3.13/bin/python3
          "$P" -c "import ssl; print(ssl.get_default_verify_paths())"
          # comme sur un Mac où le script Install Certificates n'a jamais tourné
          sudo rm -f "$("$P" -c 'import ssl; print(ssl.get_default_verify_paths().openssl_cafile)')"
          echo "PYTHON_ESSAI=$P" >> "$GITHUB_ENV"
      - name: Installation, interface, planification, notification, mise à jour
        run: sh .github/essai_installation.sh

  paquets:
    name: Paquets par double-clic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Construction et essai comme un utilisateur
        run: sh .github/essai_paquets.sh
